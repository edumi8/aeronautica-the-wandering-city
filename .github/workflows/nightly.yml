name: nightly

# Full suite (Phase 10 "Nightly/full workflow"): everything ci.yml runs,
# reused via workflow_call (never duplicated -- see ci.yml's header comment),
# plus the heavier suites that are too slow/flaky for every PR: Forge
# GameTests, worldgen, performance capture, and a non-blocking Java 21
# compatibility experiment.

on:
# 05:17 UTC daily -- off-the-hour to avoid GitHub's fixed-time scheduling thundering herd
  workflow_dispatch:
    inputs:
      worldgen_radius:
        description: 'Worldgen suite chunk radius'
        type: number
        default: 300
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci:
    name: Run the standard PR/push suite
    uses: ./.github/workflows/ci.yml

  gametest:
    name: Forge GameTests (Java 17)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r tests/requirements.txt
      - name: Download the exact artifact the build job produced
        uses: actions/download-artifact@v4
        with:
          name: mrpack-build-${{ github.sha }}
          path: releases
      - name: Cache ForgeGradle/Gradle/MCP downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/gametest/.gradle
          key: forgegradle-${{ runner.os }}-mc1.20.1-forge47.4.10-${{ hashFiles('tests/gametest/build.gradle') }}
          restore-keys: |
            forgegradle-${{ runner.os }}-mc1.20.1-forge47.4.10-
      - name: gametest suite
        run: python scripts/test_pipeline.py gametest --output-dir test-results
      - name: Upload test-results and Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gametest-ubuntu-mc1.20.1-forge47.4.10-${{ github.sha }}
          path: |
            test-results/**
            tests/gametest/run/logs/**
            tests/gametest/run/crash-reports/**
          if-no-files-found: warn
          retention-days: 30

  worldgen-and-performance:
    name: Worldgen + performance capture (Docker, nightly radius)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r tests/requirements.txt
      - name: Download the exact artifact the build job produced
        uses: actions/download-artifact@v4
        with:
          name: mrpack-build-${{ github.sha }}
          path: releases
      - name: worldgen suite
        run: python scripts/test_pipeline.py worldgen --worldgen-radius ${{ inputs.worldgen_radius || 300 }} --output-dir test-results
      - name: Upload worldgen/performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-worldgen-ubuntu-${{ github.sha }}
          path: test-results/**
          if-no-files-found: warn
          retention-days: 30

  java21-experiment:
    name: 'Non-blocking: Java 21 compatibility experiment'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r tests/requirements.txt
      - name: Download the exact artifact the build job produced
        uses: actions/download-artifact@v4
        with:
          name: mrpack-build-${{ github.sha }}
          path: releases
      - name: Cache ForgeGradle/Gradle/MCP downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            tests/gametest/.gradle
          key: forgegradle-java21-${{ runner.os }}-mc1.20.1-forge47.4.10-${{ hashFiles('tests/gametest/build.gradle') }}
      - name: gametest suite under Java 21 (informational only -- Java 17 remains release-gating)
        run: python scripts/test_pipeline.py gametest --output-dir test-results-java21
        env:
          # Documents intent for anyone reading run logs; does not change
          # pass/fail handling -- `continue-on-error: true` on this job is
          # what makes it genuinely non-blocking (see TESTING.md "why Java
          # 17 and Forge 47.4.10 are pinned").
          AERONAUTICA_JAVA21_EXPERIMENT: 'true'
      - name: Upload Java 21 experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java21-experiment-${{ github.sha }}
          path: test-results-java21/**
          if-no-files-found: warn
          retention-days: 14
