modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/edumi8/aeronautica-the-wandering-city/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Aeronautica GameTest Suite"
description = '''Development-only Forge GameTest suite for Aeronautica: The Wandering City.
Never present in the release .mrpack -- see TESTING.md.'''
authors = "Aeronautica project"

[[dependencies.'${mod_id}']]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.'${mod_id}']]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"
